name: vendorrisk

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vendorrisk};Username=${POSTGRES_USER:-vendorrisk};Password=${POSTGRES_PASSWORD:-vendorrisk}"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vendorrisk}
      POSTGRES_USER: ${POSTGRES_USER:-vendorrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vendorrisk}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vendorrisk} -d ${POSTGRES_DB:-vendorrisk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional log stack: docker compose --profile elk up
  # Adding the Elasticsearch sink through Serilog__WriteTo__1__* keeps the console sink at index 0.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["elk"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      # Also holds the .kibana index, so saved objects such as the data view below survive a
      # `docker compose down` along with the logs themselves.
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["elk"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

  # Registers the Discover data view so the logs are browsable without any manual setup.
  # Runs once and exits; re-running is harmless because the data view has a fixed id.
  kibana-setup:
    image: curlimages/curl:8.10.1
    profiles: ["elk"]
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        # Check by id first: Kibana answers a duplicate POST with 400, which is indistinguishable
        # from a genuine bad request, so existence is tested rather than inferred from the error.
        if curl -sf -o /dev/null http://kibana:5601/api/data_views/data_view/vendorrisk-logs; then
          echo "Kibana data view 'VendorRisk logs' already exists."
          exit 0
        fi
        # allowNoIndex lets this succeed before the API has written its first log line.
        status=$$(curl -s -o /tmp/body -w '%{http_code}' \
          -X POST http://kibana:5601/api/data_views/data_view \
          -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"data_view":{"id":"vendorrisk-logs","title":"vendorrisk-logs-*","name":"VendorRisk logs","timeFieldName":"@timestamp","allowNoIndex":true}}')
        if [ "$$status" = "200" ]; then
          echo "Kibana data view 'VendorRisk logs' created."
        else
          echo "Failed to create Kibana data view (HTTP $$status):"
          cat /tmp/body
          exit 1
        fi

volumes:
  postgres-data:
  elasticsearch-data:
